name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (optional)
        uses: actions/setup-node@v4
        with:
          # Updated to Node 24 to remove deprecation warnings
          node-version: '24'

      - name: Install dependencies (if present)
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "no package.json, skipping npm install"
          fi

      - name: Run lint/build (if present)
        run: |
          if [ -f package.json ]; then
            npm run lint --if-present || true
            npm run build --if-present || true
          else
            echo "no package.json, skipping lint/build"
          fi

      - name: Prepare static files for deployment
        run: |
          mkdir _site
          cp index.html _site/
          cp -r css _site/
          cp -r js _site/

      - name: Configure Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4